services:
  - type: web
    name: mrinals-creations
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT server:app
    envVars:
      - key: DATA_DIR
        value: /opt/render/project/src/data
    disk:
      name: mrinals-store-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1